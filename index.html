<!doctype html>
<html lang="en">

<title>街ノート</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{
  --paper:#F2F4F3;--card:#FFFFFF;--ink:#1B2A3A;--soft:#5E6B7A;
  --ai:#2B4C7E;--ai-wash:#E3EAF4;--shu:#C23B22;--shu-wash:#F7E4E0;
  --moss:#3F7355;--moss-wash:#E1EEE5;--line:#D8DDE2;--on-ai:#FFFFFF;
  --jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#11161C;--card:#19212A;--ink:#E6EBF0;--soft:#98A4B2;
    --ai:#8EAEDD;--ai-wash:#1F2C3E;--shu:#E0664E;--shu-wash:#3A2420;
    --moss:#7FB894;--moss-wash:#1C2E24;--line:#2A3440;--on-ai:#11161C;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11161C;--card:#19212A;--ink:#E6EBF0;--soft:#98A4B2;
  --ai:#8EAEDD;--ai-wash:#1F2C3E;--shu:#E0664E;--shu-wash:#3A2420;
  --moss:#7FB894;--moss-wash:#1C2E24;--line:#2A3440;--on-ai:#11161C;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:18px 18px 120px}
img{max-width:100%}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-family:var(--jp);font-weight:700;font-size:28px}
h2{font-size:16px;font-weight:700;margin-bottom:10px}
p{margin:0 0 10px}
.soft{color:var(--soft)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.jp{font-family:var(--jp)}
.sec{margin:28px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack>*+*{margin-top:10px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{display:flex;max-width:640px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;padding:9px 2px 11px;color:var(--soft);font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;position:relative}
nav.tabs .k{font-family:var(--jp);font-size:21px;line-height:1.15;font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .k{color:var(--shu)}
nav.tabs .dot{position:absolute;top:6px;left:calc(50% + 12px);min-width:17px;height:17px;border-radius:9px;background:var(--shu);color:#fff;font-size:10.5px;line-height:17px;padding:0 4px;font-weight:700}

/* hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:6px 0 4px}
.count{font-family:var(--jp);font-weight:700;font-size:clamp(46px,13vw,68px);line-height:1}
.count .u{font-size:.36em;font-weight:500;margin-left:6px}
.phase{font-size:14px;color:var(--soft);text-align:right;max-width:52%}
.phase b{display:block;color:var(--ink);font-weight:700}

/* hanko stamps */
.stamps{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin:18px 0 6px}
.stamp{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--jp);font-size:clamp(9px,2.4vw,13px);color:transparent;font-weight:700;user-select:none}
.stamp.done{border:2px solid var(--shu);color:var(--shu);transform:rotate(-10deg);background:color-mix(in srgb,var(--shu) 7%,transparent)}
.stamp.today{outline:2px solid var(--ai);outline-offset:2px}
.stamp.fresh{animation:stampIn .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{0%{transform:scale(2.4) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-10deg);opacity:1}}
@media (prefers-reduced-motion:reduce){.stamp.fresh{animation:none}}

/* tasks */
.task{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:2px}
.task:last-child{padding-bottom:2px}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700}
.check.on{background:var(--moss);border-color:var(--moss);color:var(--card)}
.task .body{flex:1;min-width:0}
.task .t{font-weight:700}
.hunt-pill{display:inline-flex;align-items:baseline;gap:8px;background:var(--ai-wash);border-radius:10px;padding:6px 10px;margin:6px 6px 0 0}
.hunt-pill .p{font-family:var(--jp);font-weight:700;font-size:17px}
.hunt-pill.caught{background:var(--moss-wash)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat .n{font-family:var(--jp);font-size:24px;font-weight:700;line-height:1.2}
.stat .l{font-size:11.5px;color:var(--soft)}

/* controls */
.btn{font:inherit;font-weight:500;font-size:15px;border-radius:11px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
.btn.shu{background:var(--shu);border-color:var(--shu);color:#fff}
.btn.quiet{background:none;border-color:transparent;color:var(--ai);padding-left:6px;padding-right:6px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}
label .soft{font-weight:400}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-height:44px}
textarea.jp{font-family:var(--jp);font-size:20px;line-height:1.7;min-height:96px;resize:vertical}
input.jp{font-family:var(--jp);font-size:18px}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:13px;padding:9px 4px;color:var(--soft);cursor:pointer;min-height:44px;line-height:1.25}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ai-wash);color:var(--ink);font-weight:700}
.seg .jp{font-size:16px;display:block;font-weight:700}

/* sentences and cards */
.sent{font-family:var(--jp);font-size:clamp(22px,5.8vw,27px);line-height:1.85;word-break:break-word}
.sent mark{background:var(--ai-wash);color:inherit;border-bottom:2.5px solid var(--ai);padding:0 2px;border-radius:3px}
.gap{display:inline-block;min-width:3.4em;height:1.1em;border-bottom:2.5px solid var(--shu);margin:0 4px;vertical-align:-.1em}
.where{font-size:13px;color:var(--soft);display:flex;gap:6px;align-items:baseline;margin-bottom:10px}
.where::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--shu);transform:translateY(-1px)}
.answer{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px}
.target{font-family:var(--jp);font-size:30px;font-weight:700;line-height:1.3}
.reading{color:var(--soft);font-size:15px}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--ai-wash);color:var(--ai);font-weight:700;vertical-align:middle}
.badge.n3{background:var(--shu-wash);color:var(--shu)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades .btn{flex-direction:column;gap:0;padding:8px 4px;font-size:14px}
.grades .btn small{font-size:11px;color:var(--soft);font-weight:400}
.grades .again{border-color:var(--shu);color:var(--shu)}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--ai)}

.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item input{width:20px;height:20px;margin-top:6px;flex:none;accent-color:var(--ai)}
.item .s{font-family:var(--jp);font-size:20px;font-weight:700}
.item .m{font-size:14px}

.list-row{padding:12px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.gp{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.gp:first-child{border-top:0}
.gp .p{font-family:var(--jp);font-weight:700;font-size:18px;min-width:6.5em}
.gp .ex{font-family:var(--jp);font-size:14.5px;color:var(--soft);margin-top:2px}
.mark-btn{margin-left:auto;flex:none}
.caught-flag{color:var(--moss);font-weight:700;font-size:13px}

.passage{font-family:var(--jp);font-size:18.5px;line-height:1.95;white-space:pre-wrap;word-break:break-word}
.timer{font-family:var(--jp);font-weight:700;font-size:34px;line-height:1}
.timer.over{color:var(--shu)}
.q{margin-top:18px}
.q .qt{font-family:var(--jp);font-size:17px;font-weight:700;margin-bottom:8px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;font-family:var(--jp);font-size:16.5px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-top:6px;cursor:pointer;min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-wash)}
.opt.right{border-color:var(--moss);background:var(--moss-wash)}
.opt.wrong{border-color:var(--shu);background:var(--shu-wash)}
.opt .no{font-family:var(--ui);font-weight:700;color:var(--soft)}
.log-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.log-row:first-child{border-top:0}
.ok{color:var(--moss);font-weight:700}
.bad{color:var(--shu);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-family:var(--jp);font-size:16px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:8px 12px;cursor:pointer}
.empty{text-align:center;padding:36px 16px}
.empty .big{font-family:var(--jp);font-size:44px;color:var(--shu);line-height:1.2;margin-bottom:6px}
.note{background:var(--ai-wash);border-radius:12px;padding:12px 14px;font-size:14px}
.err{color:var(--shu);font-size:14px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw}
.hide{display:none!important}
details summary{cursor:pointer;color:var(--ai);font-weight:500;min-height:44px;display:flex;align-items:center}
.capture-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cap-btn{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:700;font-size:14px;min-height:84px}
.cap-btn .k{font-size:30px;color:var(--shu);line-height:1.15}
.cap-btn:active{background:var(--ai-wash)}
.crop-wrap{text-align:center;margin-top:8px}
.crop{position:relative;display:inline-block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;line-height:0;overflow:hidden;border-radius:8px;max-width:100%}
.crop img{max-width:100%;max-height:62vh;display:block;pointer-events:none}
.crop-sel{position:absolute;border:2.5px solid var(--shu);border-radius:4px;display:none;box-shadow:0 0 0 9999px rgba(0,0,0,.38)}
.thumb-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.thumb{width:96px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb.big{display:block;width:100%;height:auto;max-height:260px;object-fit:contain;margin-top:12px;background:var(--paper)}
.chip[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-wash)}
label.item{margin:0;font-weight:400}
.topbar{display:flex;justify-content:flex-end;margin:-6px -6px 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

  mid:{jp:"中文",en:"Medium",chars:"about 350 Japanese characters",min:6,q:3},

};
const TABS = [["today","今","Today"],["capture","拾","Capture"],["review","復","Review"],["hunt","探","Grammar"],["read","読","Reading"]];

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="text") el.textContent=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else el.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
const pad=n=>String(n).padStart(2,"0");
function ymd(d=new Date()){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseD(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d);}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/864e5);}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>ymd();
function clone(o){return JSON.parse(JSON.stringify(o));}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hide");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add("hide"),2800);}
function fmtSec(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+pad(s%60);}

/* ---------- state ---------- */
function defaultState(){return {settings:{lang:"English",goal:5}, days:{}, hunt:{caught:{},today:null,ptr:0}, reads:[]};}

let CARDS = [];
function mergeState(base, o){
  const r=clone(base);
  if(o&&typeof o==="object"){
    r.settings=Object.assign(r.settings,o.settings||{});
    r.days=o.days||{};
    r.hunt=Object.assign(r.hunt,o.hunt||{});
    r.hunt.caught=r.hunt.caught||{};
    r.reads=Array.isArray(o.reads)?o.reads:[];
  }
  return r;
}

/* ---------- storage: text in localStorage, photos in IndexedDB ---------- */
const Store={
  mode:"local",
  async init(){
    try{
      const raw=localStorage.getItem("machinote-v1");
      if(raw){const o=JSON.parse(raw); S=mergeState(S,o.S); CARDS=Array.isArray(o.CARDS)?o.CARDS:[];}
    }catch(e){}
    try{await IDB.open();}catch(e){console.warn("IndexedDB unavailable",e);}
    try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
  },
  prune(){
    const cutoff=addDays(today(),-150);
    for(const k of Object.keys(S.days)) if(k<cutoff) delete S.days[k];
    if(S.reads.length>300) S.reads=S.reads.slice(-300);
  },
  _t:null,
  saveStateSoon(){clearTimeout(this._t);this._t=setTimeout(()=>this.saveState(),400);},
  saveState(){this.prune();this.local();},
  saveCard(){this.local();},
  deleteCard(id){
    const c=CARDS.find(x=>x.id===id);
    CARDS=CARDS.filter(x=>x.id!==id);
    if(c&&c.photo&&!CARDS.some(x=>x.photo===c.photo)) IDB.del(c.photo);
    this.local();
  },
  local(){
    try{localStorage.setItem("machinote-v1",JSON.stringify({S,CARDS}));}
    catch(e){toast("Phone storage is full. Export a backup and delete old cards.");}
  }
};
const IDB={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("machinote",1);r.onupgradeneeded=()=>r.result.createObjectStore("imgs");r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  put(k,v){return new Promise((res,rej)=>{if(!this.db)return rej("no db");const t=this.db.transaction("imgs","readwrite");t.objectStore("imgs").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});},
  get(k){return new Promise(res=>{try{const r=this.db.transaction("imgs").objectStore("imgs").get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);}catch(e){res(null);}});},
  del(k){try{this.db.transaction("imgs","readwrite").objectStore("imgs").delete(k);}catch(e){}},
  all(){return new Promise(res=>{try{const out={};const r=this.db.transaction("imgs").objectStore("imgs").openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue();}else res(out);};r.onerror=()=>res(out);}catch(e){res({});}});}
};
const photoCache={};

/* ---------- Claude API (direct from the phone, with your key) ---------- */
async function callClaude(prompt,{image=null,maxTokens=2500,signal}={}){
  if(!CFG.key) throw {code:"no_key"};
  const content=[];
  if(image) content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:image}});
  content.push({type:"text",text:prompt});
  let res;
  try{
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,
      headers:{"content-type":"application/json","x-api-key":CFG.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:CFG.model,max_tokens:maxTokens,messages:[{role:"user",content}]})});
  }catch(e){ if(e&&e.name==="AbortError") throw {code:"cancelled"}; throw {code:"network"}; }
  if(!res.ok){let msg="";try{const j=await res.json();msg=(j.error&&j.error.message)||"";}catch(e){} throw {code:"http",status:res.status,message:msg};}
  const j=await res.json();
  return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}
async function claudeJSON(prompt,opts){
  const t=await callClaude(prompt+"\n\nReply with the JSON only, no other text.",opts);
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a<0||b<a) throw {code:"invalid_json"};
  try{return JSON.parse(t.slice(a,b+1));}catch(e){throw {code:"invalid_json"};}
}
function aiError(e){
  const c=e&&e.code;
  if(c==="cancelled") return "";
  if(c==="no_key") return "Add your Anthropic API key in Settings first.";
  if(c==="network") return navigator.onLine===false?"You're offline. Reviews still work; analysis needs internet.":"Couldn't reach Claude. Check your connection and try again.";
  if(c==="invalid_json") return "The answer came back in an unexpected format. Try again.";
  if(c==="http"){
    if(e.status===401) return "The API key was rejected. Check it in Settings.";
    if(e.status===403) return "This API key isn't allowed to do that. Check it in Settings.";
    if(e.status===404||(e.status===400&&/model/i.test(e.message||""))) return "That model isn't available for your key. Pick another one in Settings.";
    if(e.status===400&&/credit|balance|billing/i.test(e.message||"")) return "Your API account is out of credit. Top it up in the Anthropic console.";
    if(e.status===429) return "Rate limit reached. Wait a minute and try again.";
    if(e.status>=500) return "Claude is busy right now. Try again in a moment.";
    return "Request failed ("+e.status+"). "+(e.message||"");
  }
  return "Something went wrong while asking Claude. Try again.";
}

function loadImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>res({img,url});img.onerror=()=>rej(new Error("image"));img.src=url;});}
function toJpeg(img,rect,maxEdge,q){
  const nw=img.naturalWidth, nh=img.naturalHeight;
  const r=rect?{x:rect.x*nw,y:rect.y*nh,w:rect.w*nw,h:rect.h*nh}:{x:0,y:0,w:nw,h:nh};
  const sc=Math.min(1,maxEdge/Math.max(r.w,r.h));
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(r.w*sc)); c.height=Math.max(1,Math.round(r.h*sc));
  const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,r.x,r.y,r.w,r.h,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q);
}

function dayRec(d=today()){return S.days[d]||(S.days[d]={cap:0,rev:0,read:0,done:false});}
function dueCards(){const t=today();return CARDS.filter(c=>c.srs&&c.srs.due<=t);}

  const r=dayRec();
  if(r.done) return;
  if(r.rev>=10||r.cap>=3||(r.rev>0&&dueCards().length===0)||r.read>=1){r.done=true;freshStamp=true;}
}
function phase(){
  const t=today();
  if(t<"2026-11-02") return {n:1,title:"Phase 1: build the habit",line:"Capture daily, hunt grammar, 2 timed readings a week.",readDays:[1,4]};
  if(t<"2026-11-23") return {n:2,title:"Phase 2: reading speed",line:"3 timed readings a week and one full mock exam.",readDays:[1,3,6]};
  if(t<=EXAM) return {n:3,title:"Phase 3: final review",line:"Review only. Second mock early, then rest before the exam.",readDays:[2,5]};
  return {n:4,title:"Exam done",line:"Good luck with the result.",readDays:[]};

function ensureHunt(){
  const t=today();
  if(S.hunt.today&&S.hunt.today.date===t) return;
  const ids=[]; let p=S.hunt.ptr||0, guard=0;
  while(ids.length<2&&guard<GRAMMAR.length*2){
    const g=GRAMMAR[p%GRAMMAR.length]; p++; guard++;
    if(!S.hunt.caught[g[0]]&&!ids.includes(g[0])) ids.push(g[0]);
  }
  S.hunt.ptr=p%GRAMMAR.length;
  S.hunt.today={date:t,ids};
  Store.saveStateSoon();
}
function swapHunt(id){
  const ids=S.hunt.today.ids; let p=S.hunt.ptr||0, guard=0;
  while(guard<GRAMMAR.length){
    const g=GRAMMAR[p%GRAMMAR.length]; p++; guard++;
    if(!S.hunt.caught[g[0]]&&!ids.includes(g[0])){ids[ids.indexOf(id)]=g[0];break;}
  }
  S.hunt.ptr=p%GRAMMAR.length; Store.saveStateSoon(); render();
}
function markCaught(gid, cardId){
  if(!GMAP[gid]) return false;
  const was=!!S.hunt.caught[gid];
  S.hunt.caught[gid]={card:cardId||null,date:today()};
  return !was;
}

/* ---------- SRS ---------- */
function newSrs(){return {due:today(),interval:0,ease:2.5,reps:0,lapses:0};}
function schedule(s,g){
  s=Object.assign({},s);
  if(g===0){s.reps=0;s.lapses=(s.lapses||0)+1;s.ease=Math.max(1.3,s.ease-0.2);s.interval=0;}
  else{
    if(s.reps===0) s.interval=g===3?3:1;
    else if(s.reps===1) s.interval=g===1?2:g===2?3:5;
    else s.interval=Math.round(s.interval*(g===1?1.2:g===2?s.ease:s.ease*1.3));
    s.interval=Math.min(21,Math.max(1,s.interval));
    s.ease=Math.max(1.3,s.ease+(g===1?-0.15:g===3?0.15:0));
    s.reps++;
  }
  s.due=addDays(today(),s.interval);
  return s;
}
function ivLabel(s,g){if(g===0)return "again";const n=schedule(s,g).interval;return n===1?"1 day":n+" days";}

let draft, shot=null;
function resetDraft(keepContext){
  const c=draft?draft.context:"";
  draft={sentence:"",context:keepContext?c:"",unknown:"",analysis:null,sel:{},busy:false,err:"",manual:false,m_target:"",m_reading:"",m_meaning:"",ctl:null,
    photoThumb:null,lines:null,learn:null,learnSel:{}};

resetDraft(false);
function pickPhoto(useCamera){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  if(useCamera) inp.setAttribute("capture","environment");
  inp.style.display="none"; document.body.append(inp);
  inp.onchange=()=>{const f=inp.files&&inp.files[0]; inp.remove(); if(f) startShot(f);};
  inp.click();
}
async function startShot(file){
  try{
    const {img,url}=await loadImage(file);
    if(shot&&shot.url) URL.revokeObjectURL(shot.url);
    shot={img,url,rect:null,busy:false,err:""};
    view="capture"; render(); window.scrollTo(0,0);
  }catch(e){toast("That image couldn't be opened.");}
}
function shotPanel(){

    h("p",{class:"small soft"},"Drag a box around the sentence or word. Or read the whole image."));

  setSel(shot.rect);

  box.addEventListener("pointerdown",e=>{if(shot.busy)return;start=pos(e);box.setPointerCapture(e.pointerId);setSel({x:start.x,y:start.y,w:0,h:0});e.preventDefault();});

  box.addEventListener("pointerup",e=>{if(!start)return;const q=pos(e);const r={x:Math.min(start.x,q.x),y:Math.min(start.y,q.y),w:Math.abs(q.x-start.x),h:Math.abs(q.y-start.y)};start=null;shot.rect=(r.w>0.03&&r.h>0.015)?r:null;render();});
  box.addEventListener("pointercancel",()=>{start=null;setSel(shot.rect);});

  p.append(h("div",{class:"row",style:"margin-top:12px"},

    h("button",{class:"btn"+(shot.rect?"":" primary"),disabled:shot.busy,onclick:()=>readShot(false)},shot.busy&&!shot.rect?"Reading…":"Read whole image"),
    shot.rect&&!shot.busy?h("button",{class:"btn quiet",onclick:()=>{shot.rect=null;render();}},"Clear box"):null,

async function readShot(useSel){
  if(!hasAI()){shot.err=aiError({code:"no_key"});render();return;}
  shot.busy=true;shot.err="";render();
  try{
    const rect=useSel?shot.rect:null;
    const full=toJpeg(shot.img,rect,1568,0.85).split(",")[1];
    const thumb=toJpeg(shot.img,rect,560,0.72);
    const r=await claudeJSON(`This image was captured in Tokyo by a JLPT N3 learner: a screenshot of an email, chat or web page, or a photo of a sign, slide, poster, menu or document.${useSel?" It is the part he marked because he wants to learn from it.":""}

Return JSON: {"lines":["each Japanese sentence or phrase in the image, exactly as written, in reading order, up to 8"],"learn":[{"text":"a word, kanji compound or grammar pattern exactly as written in the image","reading":"hiragana","meaning":"short meaning in ${explainLang()}"}]}

"learn": up to 6 items at N3 or N2 level that are worth learning for the exam; skip easy N5 words. If there is no Japanese text, return {"lines":[],"learn":[]}.`,{image:full,maxTokens:1500});
    const lines=(Array.isArray(r.lines)?r.lines:[]).filter(x=>typeof x==="string"&&x.trim()).slice(0,8);
    const learn=(Array.isArray(r.learn)?r.learn:[]).filter(x=>x&&x.text).slice(0,6);
    if(!lines.length&&!learn.length){shot.busy=false;shot.err="No Japanese text found. Try a closer photo or a tighter box.";render();return;}
    resetDraft(true);
    draft.photoThumb=thumb; draft.lines=lines; draft.learn=learn;
    if(lines.length===1) draft.sentence=lines[0];
    URL.revokeObjectURL(shot.url); shot=null;
  }catch(e){shot.busy=false;shot.err=aiError(e);}
  render();
}

async function analyze(){
  const s=draft.sentence.trim();
  if(!s){draft.err="Type, paste or pick a sentence first.";render();return;}
  draft.busy=true;draft.err="";draft.analysis=null;draft.ctl=new AbortController();render();
  const prompt=`You help a JLPT N3 learner (native German speaker, works at a Japanese company HQ in Tokyo, around high-N4 / low-N3 in vocabulary and grammar). He met this Japanese text in real life.

Text: ${s}
Where he met it: ${draft.context.trim()||"(not given)"}
What he says he didn't know: ${draft.unknown.trim()||"(not given)"}

Write all meanings, translations and notes in ${explainLang()}.

Return JSON in exactly this shape:
{"sentence":"the sentence, fixing only obvious typos","reading":"the whole sentence in hiragana","translation":"natural translation","items":[{"kind":"vocab or grammar","surface":"the exact substring as it appears in the sentence","base":"dictionary form","reading":"hiragana reading of the surface (for grammar, the pattern in hiragana)","meaning":"short meaning in context","level":"N5, N4, N3, N2, N1 or business","note":"one short usage note useful for the JLPT"}],"grammarIds":["ids from the list below that clearly appear in the sentence"]}

Rules: up to 6 items. Put what he said he didn't know first (it may list several items separated by 、). Then add vocabulary and grammar at N3 or N2 level worth learning for the exam; skip obvious N5 words. "surface" must be copied character-for-character from "sentence". If the text is only a word or a short phrase (for example from a sign), keep it as the first item and write one natural N3-level example sentence in "sentence" that contains it exactly. grammarIds may be empty.

N3 grammar list:
${grammarListText()}`;
  try{
    const r=await claudeJSON(prompt,{signal:draft.ctl.signal});
    if(!r||!Array.isArray(r.items)) throw {code:"invalid_json"};
    r.items=r.items.filter(i=>i&&i.surface).slice(0,6);
    r.grammarIds=(Array.isArray(r.grammarIds)?r.grammarIds:[]).filter(id=>GMAP[id]);
    draft.analysis=r; draft.sel={};
    const marked=draft.unknown.split(/[、,]/).map(x=>x.trim()).filter(Boolean);
    r.items.forEach((it,i)=>{const lv=String(it.level||"");draft.sel[i]=marked.some(m=>it.surface.includes(m)||m.includes(it.surface)||(it.base&&it.base.includes(m)))||/N3|N2|N1|business/i.test(lv);});
    if(!Object.values(draft.sel).some(Boolean)&&r.items.length) draft.sel[0]=true;
  }catch(e){draft.err=aiError(e);}
  draft.busy=false;draft.ctl=null;render();
}

  const rs=S.reads.slice(-10).reverse();
  const box=h("div",{class:"sec"},h("h2",null,"Recent readings"));
  if(!rs.length){box.append(h("p",{class:"soft small"},"No readings yet. Your times will show up here."));return box;}
  const p=h("div",{class:"panel"});
  for(const r of rs){
    const within=r.sec<=r.target*60;
    p.append(h("div",{class:"log-row"},h("span",null,r.date.slice(5).replace("-","/")+"  ",h("span",{class:"jp"},RTYPES[r.type]?RTYPES[r.type].jp:r.type),r.src==="book"?h("span",{class:"soft"}," (book)"):null),
      h("span",null,h("span",{class:within?"ok":"bad"},fmtSec(r.sec))," / "+r.target+":00   "+r.ok+"/"+r.tot)));
  }
  box.append(p); return box;
}
async function genPassage(){
  const T=RTYPES[R.type];
  const words=[...CARDS].sort((a,b)=>(b.created||"").localeCompare(a.created||"")).slice(0,15).map(c=>c.base||c.target);
  R.status="loading";R.err="";R.ctl=new AbortController();render();
  const prompt=`Write one original JLPT N3-style reading comprehension (読解) item.

Type: ${T.jp}. Length: ${T.chars}. Number of questions: ${T.q}.
Topic: everyday or work life in Japan (office, commuting, neighborhood, shops, family). Vary the topic.
Use natural N3-level vocabulary, grammar and kanji, like the real exam. Write the passage in plain or polite style as fits the genre.
${words.length?"Where it fits naturally, reuse a few of these words the learner is studying: "+words.join("、")+".":""}
Questions and options must be in Japanese, like the real exam, each with exactly 4 options and one clearly correct answer. Make the wrong options plausible.
Write each explanation in ${explainLang()}, one or two sentences, pointing to the part of the passage that gives the answer.

Return only JSON: {"title":"short Japanese title or empty string","passage":"...","questions":[{"q":"...","options":["...","...","...","..."],"answer":0,"explain":"..."}]}
"answer" is the 0-based index of the correct option.`;
  try{
    const r=await claudeJSON(prompt,{signal:R.ctl.signal,maxTokens:3000});
    if(!r||typeof r.passage!=="string"||!Array.isArray(r.questions)) throw {code:"invalid_json"};
    const qs=r.questions.filter(q=>q&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length);
    if(!qs.length) throw {code:"invalid_json"};
    R.item={type:R.type,title:r.title||"",passage:r.passage,questions:qs};
    R.ans=[];R.start=Date.now();R.status="reading";
  }catch(e){R.err=aiError(e);R.status="idle";}
  R.ctl=null;render();
}

async function shareOrDownload(filename,text,mime){
  const blob=new Blob([text],{type:mime});
  try{
    const file=new File([blob],filename,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
function exportJSON(){shareOrDownload("machi-note-backup-"+today()+".json",JSON.stringify({S,CARDS,photos:photoDump||{}}),"application/json");}
function exportCSV(){
  const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const rows=[["sentence","target","reading","meaning","translation","where","created"].map(q).join(",")];
  for(const c of CARDS) rows.push([c.sentence,c.target,c.targetReading,c.meaning,c.translation,c.context,c.created].map(q).join(","));
  shareOrDownload("machi-note-cards-"+today()+".csv","\ufeff"+rows.join("\n"),"text/csv");
}
async function importJSON(file){
  if(!file) return;
  try{
    const o=JSON.parse(await file.text());
    if(!o||!Array.isArray(o.CARDS)) throw new Error("format");
    if(CARDS.length&&!confirm("Replace the "+CARDS.length+" cards on this phone with the "+o.CARDS.length+" cards in the backup?")) return;
    S=mergeState(defaultState(),o.S); CARDS=o.CARDS.filter(c=>c&&c.id&&c.sentence);
    if(o.photos&&typeof o.photos==="object") for(const [k,v] of Object.entries(o.photos)) if(typeof v==="string") await IDB.put(k,v).catch(()=>{});
    Store.saveState(); session=null; toast("Imported "+CARDS.length+" cards"); render();
  }catch(e){toast("That file isn't a 街ノート backup.");}
}
